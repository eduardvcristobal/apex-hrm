return'<div class="card"><h2>Journal entry, Nov 5, 2026 '+chip(st.posted?"ok":"mute",st.posted?"Posted":"Draft")+" "+chip(D===C?"ok":"bad",D===C?"Balanced":"Out of balance")+'<button class="btn sm" id="post"'+(st.posted?" disabled":"")+">"+(st.posted?"Posted":"Post to ledger")+'</button></h2><div class="sc"><table><thead><tr><th>Account</th><th>Name</th><th class="r">Debit</th><th class="r">Credit</th></tr></thead><tbody>'+ks.map(function(k){return"<tr><td>"+k+"</td><td>"+m[k].n+'</td><td class="r">'+(m[k].d?P(r2(m[k].d)):"")+'</td><td class="r">'+(m[k].c?P(r2(m[k].c)):"")+"</td></tr>"}).join("")+'<tr class="tot"><td></td><td>Total</td><td class="r">'+P(D)+'</td><td class="r">'+P(C)+'</td></tr></tbody></table></div><div class="note">Generation stops if a pay item has no GL mapping or the entry does not balance. Lines also carry the cost center of each employee.</div></div>'}
V.bank=function(R){if(st.i<3)return'<div class="card"><div class="pad">Bank files are generated after the run is approved.</div></div>';
var rows=[],skip=[],tt=0;E.forEach(function(e,i){if(!e.bank)skip.push(e.n+": no bank account on file");else if(e.bank!==st.bank)skip.push(e.n+": paid through "+e.bank);else{tt+=R[i].net;rows.push("00"+(1230+i*37)+"4821,"+e.n+","+R[i].net.toFixed(2))}});
return'<div class="card"><h2>Bank crediting file<select id="bk"><option'+(st.bank==="BDO"?" selected":"")+">BDO</option><option"+(st.bank==="BPI"?" selected":"")+">BPI</option></select></h2><pre>ACCOUNT_NO,ACCOUNT_NAME,AMOUNT\n"+rows.join("\n")+'</pre><div class="pad"><b>'+rows.length+" records · "+P(r2(tt))+'</b> <button class="btn sm" data-t="File downloaded (prototype)">Download CSV</button></div></div><div class="card"><h2>Not in this file '+chip(skip.length?"warn":"ok",String(skip.length))+'</h2><ul class="cl">'+skip.map(function(s){return'<li><span class="mk warn">!</span><div class="t">'+s+"</div></li>"}).join("")+'</ul><div class="note">Account numbers are fake. Each bank has its own template, and employees without an account stay out until HR adds one.</div></div>'}
V.rem=function(R){if(st.i<1)return'<div class="card"><div class="pad">Compute the run to see what is owed to each agency.</div></div>';
var s=function(c){return r2(R.reduce(function(a,x){return a+x.L.filter(function(l){return l.c===c}).reduce(function(b,l){return b+l.a},0)},0))},rows=[["SSS",s("SSS_EE"),s("SSS_ER")+s("SSS_EC")],["PhilHealth",s("PHIC_EE"),s("PHIC_ER")],["Pag-IBIG",s("HDMF_EE"),s("HDMF_ER")],["BIR withholding tax",s("WTAX"),0]];
return'<div class="card"><h2>Amounts to remit for this run</h2><div class="sc"><table><thead><tr><th>Agency</th><th class="r">Withheld from employees</th><th class="r">Employer share</th><th class="r">Total to remit</th></tr></thead><tbody>'+rows.map(function(x){return"<tr><td><b>"+x[0]+'</b></td><td class="r">'+P(x[1])+'</td><td class="r">'+P(x[2])+'</td><td class="r"><b>'+P(r2(x[1]+x[2]))+"</b></td></tr>"}).join("")+'</tbody></table></div><div class="note">SSS employer share includes the employees’ compensation amount. Contributions are deducted on the last cutoff of the month. Remittance deadlines and file formats differ per agency; confirm them before filing.</div></div>'}
function render(){var R=head();$("#body").innerHTML=V[st.tab](R)}
function advance(){var i=st.i;if(i===0){st.i=1;st.stale=false;st.snap=live();toast("Payroll computed for 8 employees")}else if(i===1){st.i=2;toast("Sent for review")}else if(i===2){st.i=3;toast("Run approved. Journal entry and bank file are ready")}else if(i===3){st.i=4;toast("8 payslips issued, loan balances updated, pay period locked")}else if(i===4){st.i=5;toast("Run marked as paid")}render()}
document.addEventListener("click",function(e){var t=e.target,c;
if(c=t.closest("[data-tab]")){st.tab=c.getAttribute("data-tab");render()}
else if(c=t.closest("[data-sel]")){var i=+c.getAttribute("data-sel");st.sel=st.sel===i?-1:i;render()}
else if(c=t.closest("[data-aj]")){var a=ADJ[+c.getAttribute("data-aj")],v=c.getAttribute("data-v");a.s=v;if(v==="APPROVED"){a.t=st.i>=3?"next":"this";if(a.t==="this"&&st.i>=1)st.stale=true;toast(a.t==="next"?"Approved. The run is already approved, so this goes to the next run":"Approved. Recompute to include it in this run")}else toast("Rejected");render()}
else if(c=t.closest("[data-t]"))toast(c.getAttribute("data-t"));
else if(t.id==="adv")advance();
else if(t.id==="recomp"){st.stale=false;st.snap=live();render();toast("Recomputed with the latest data")}
else if(t.id==="post"){st.posted=true;render();toast("Journal entry posted")}
else if(t.id==="lo")toast("You have been signed out (prototype)")});
document.addEventListener("change",function(e){if(e.target.id==="bk"){st.bank=e.target.value;render()}});
st.snap=live();render();
</script>
