name: Payroll compliance regression
on:
  push:
    branches: [feature/m3-1-payroll-compliance]
  pull_request:
    branches: [main]
jobs:
  payroll-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run backend unit tests
        working-directory: backend
        run: mvn -B -ntp test
  frontend-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  postgres-migration-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: apex_hrm
          POSTGRES_USER: hrm
          POSTGRES_PASSWORD: hrm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hrm -d apex_hrm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify Spring startup, Flyway migrations and schema validation
        working-directory: backend
        env:
          DB_URL: jdbc:postgresql://localhost:5432/apex_hrm
          DB_USER: hrm
          DB_PASSWORD: hrm
        run: |
          set -euo pipefail
          timeout 180s mvn -B -ntp spring-boot:run > startup.log 2>&1 &
          app_pid=$!
          trap 'kill $app_pid 2>/dev/null || true' EXIT
          for attempt in $(seq 1 90); do
            if curl -fsS http://localhost:8080/actuator/health > /tmp/hrm-health.json; then
              cat /tmp/hrm-health.json
              exit 0
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              echo "Application stopped unexpectedly"
              break
            fi
            sleep 2
          done
          tail -n 150 startup.log
          exit 1
      - name: Verify final-pay identity/payment constraints and tenant RLS
        env:
          PGPASSWORD: hrm
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U hrm -d apex_hrm -f backend/scripts/m3_1_13_schema_checks.sql
      - name: Execute transactional final-pay lifecycle, uniqueness and restricted tenant-RLS regression
        env:
          PGPASSWORD: hrm
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U hrm -d apex_hrm -f backend/scripts/m3_1_14_postgres_e2e.sql
