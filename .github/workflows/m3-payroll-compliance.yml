name: Payroll compliance regression
on:
  push:
    branches: [feature/m3-1-payroll-compliance]
  pull_request:
    branches: [main]
jobs:
  payroll-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run backend unit tests
        working-directory: backend
        run: mvn -B -ntp test
  frontend-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  postgres-migration-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: apex_hrm
          POSTGRES_USER: hrm
          POSTGRES_PASSWORD: hrm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hrm -d apex_hrm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify Spring startup, Flyway migrations and schema validation
        working-directory: backend
        env:
          DB_URL: jdbc:postgresql://localhost:5432/apex_hrm
          DB_USER: hrm
          DB_PASSWORD: hrm
        run: |
          set -euo pipefail
          timeout 180s mvn -B -ntp spring-boot:run > startup.log 2>&1 &
          app_pid=$!
          trap 'kill $app_pid 2>/dev/null || true' EXIT
          for attempt in $(seq 1 90); do
            if curl -fsS http://localhost:8080/actuator/health > /tmp/hrm-health.json; then
              cat /tmp/hrm-health.json
              # Authenticated financial APIs must fail closed for anonymous clients.
              for url in \
                "http://localhost:8080/api/v1/payroll/identity-links?personnelEmployeeId=84000000-0000-4000-8000-000000000001" \
                "http://localhost:8080/api/v1/payroll/final-pay/payment-authorizations?settlementId=89000000-0000-4000-8000-000000000001" \
                "http://localhost:8080/api/v1/payroll/final-pay/bank-evidence?paymentAuthorizationId=8b000000-0000-4000-8000-000000000001"; do
                code=$(curl -s -o /dev/null -w '%{http_code}' "$url")
                if [[ "$code" != "401" && "$code" != "403" ]]; then
                  echo "Anonymous financial endpoint was not denied: $url returned $code"
                  exit 1
                fi
              done
              exit 0
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              echo "Application stopped unexpectedly"
              break
            fi
            sleep 2
          done
          tail -n 150 startup.log
          exit 1
      - name: Verify final-pay identity/payment constraints and tenant RLS
        env:
          PGPASSWORD: hrm
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U hrm -d apex_hrm -f backend/scripts/m3_1_13_schema_checks.sql
      - name: Execute transactional final-pay lifecycle, uniqueness and restricted tenant-RLS regression
        env:
          PGPASSWORD: hrm
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U hrm -d apex_hrm -f backend/scripts/m3_1_14_postgres_e2e.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U hrm -d apex_hrm -f backend/scripts/m3_1_18_snapshot_schema.sql

  authenticated-financial-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: apex_hrm
          POSTGRES_USER: hrm
          POSTGRES_PASSWORD: hrm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hrm -d apex_hrm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Start Spring Boot, seed synthetic signed-in personas, exercise concurrent financial APIs
        env:
          DB_URL: jdbc:postgresql://localhost:5432/apex_hrm
          DB_USER: hrm
          DB_PASSWORD: hrm
          PGPASSWORD: hrm
        run: |
          set -euo pipefail
          (cd backend && mvn -B -ntp spring-boot:run) > /tmp/m315-startup.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 90); do
            if curl -fsS http://localhost:8080/actuator/health > /dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then break; fi
            sleep 2
          done
          if [[ "$ready" -ne 1 ]]; then tail -n 120 /tmp/m315-startup.log; exit 1; fi
          psql -v ON_ERROR_STOP=1 -h localhost -U hrm -d apex_hrm -f backend/scripts/m3_1_15_http_seed.sql
          bash backend/scripts/m3_1_15_authenticated_http.sh
          # Verify actual stored snapshot rows are immutable after authenticated capture.
          psql -v ON_ERROR_STOP=1 -h localhost -U hrm -d apex_hrm <<'SNAPSHOT_SQL'
          BEGIN;
          SELECT set_config('app.tenant_id','81000000-0000-4000-8000-000000000001',true);
          DO $immutable$
          DECLARE snap uuid;
          BEGIN
            SELECT id INTO snap FROM payroll_final_pay_source_snapshot
             WHERE tenant_id='81000000-0000-4000-8000-000000000001' LIMIT 1;
            IF snap IS NULL THEN RAISE EXCEPTION 'No captured source snapshot'; END IF;
            BEGIN
              UPDATE payroll_final_pay_source_snapshot SET completeness_status='REVIEW_REQUIRED'
               WHERE id=snap;
              RAISE EXCEPTION 'Financial snapshot UPDATE unexpectedly succeeded';
            EXCEPTION WHEN check_violation THEN NULL;
            END;
            BEGIN
              DELETE FROM payroll_final_pay_source_snapshot WHERE id=snap;
              RAISE EXCEPTION 'Financial snapshot DELETE unexpectedly succeeded';
            EXCEPTION WHEN check_violation THEN NULL;
            END;
          END $immutable$;
          ROLLBACK;
          SNAPSHOT_SQL
          # Browser E2E: launch a real Chromium session at desktop and mobile viewports.
          npm ci --prefix frontend
          npm install --prefix frontend --no-save --package-lock=false playwright@1.56.1
          (cd frontend && npx playwright install --with-deps chromium)
          (cd frontend && npm run dev) > /tmp/m316-vite.log 2>&1 &
          frontend_pid=$!
          trap 'kill "$frontend_pid" "$app_pid" 2>/dev/null || true' EXIT
          frontend_ready=0
          for attempt in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:5173/ > /dev/null; then frontend_ready=1; break; fi
            sleep 2
          done
          if [[ "$frontend_ready" -ne 1 ]]; then tail -n 100 /tmp/m316-vite.log; exit 1; fi
          node frontend/e2e/m3_1_16_browser.cjs
          # Mutate a CI-only ledger value and prove prior source-review fingerprints go stale.
          bash backend/scripts/m3_1_19_stale_source_http.sh
          # Database evidence: exactly one authorized payment and one reviewed record.
          psql -v ON_ERROR_STOP=1 -h localhost -U hrm -d apex_hrm <<'SQL'
          DO $verify$
          DECLARE n integer;
          BEGIN
            SELECT count(*) INTO n FROM payroll_final_pay_payment_authorization
              WHERE tenant_id='81000000-0000-4000-8000-000000000001' AND status='AUTHORIZED';
            IF n<>1 THEN RAISE EXCEPTION 'Expected exactly one authorized payment, found %',n; END IF;
            SELECT count(*) INTO n FROM payroll_final_pay_bank_evidence
              WHERE tenant_id='81000000-0000-4000-8000-000000000001' AND status='EVIDENCE_REVIEWED';
            IF n<>1 THEN RAISE EXCEPTION 'Expected exactly one reviewed bank evidence, found %',n; END IF;
          END $verify$;
          SQL
