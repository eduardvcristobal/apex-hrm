name: M7.3 Financial Data Protection
on:
  pull_request:
    branches: [main]
  push:
    branches: ['feature/m7-3-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  encryption-and-migration:
    name: Bank encryption tests + Flyway V59 PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: apex_hrm
          POSTGRES_USER: hrm
          POSTGRES_PASSWORD: hrm
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hrm -d apex_hrm"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DB_URL: jdbc:postgresql://localhost:5432/apex_hrm
      DB_USER: hrm
      DB_PASSWORD: hrm
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: hrm
      PGPASSWORD: hrm
      PGDATABASE: apex_hrm
      SMTP_HEALTH_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Generate ephemeral test-only bank encryption key
        run: echo "HRM_BANK_ACCOUNT_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - name: Unit and regression suite
        working-directory: backend
        run: mvn -B -ntp verify
      - name: Start backend with Flyway V59
        run: |
          set -euo pipefail
          java -jar backend/target/apex-hrm-0.1.0-SNAPSHOT.jar > /tmp/m73-app.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; cat /tmp/m73-app.log' EXIT
          ready=false
          for n in $(seq 1 90); do
            if curl --fail --silent localhost:8080/actuator/health >/dev/null; then ready=true; break; fi
            if ! kill -0 "$pid" 2>/dev/null; then exit 1; fi
            sleep 2
          done
          test "$ready" = true
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          trap - EXIT
      - name: Verify ciphertext schema and plaintext write guard
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null; then sudo apt-get update && sudo apt-get install -y postgresql-client; fi
          psql -v ON_ERROR_STOP=1 -f scripts/db/m7_3_bank_schema_certification.sql
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m7-3-financial-certification
          path: |
            backend/target/surefire-reports/
            /tmp/m73-app.log
          if-no-files-found: ignore
