name: M7.2 Flyway Upgrade Rehearsal
on:
  pull_request:
    branches: [main]
  push:
    branches: ['feature/m7-2-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v53-to-v58:
    name: Rehearse V53 to V58 on disposable PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: apex_hrm
          POSTGRES_USER: hrm
          POSTGRES_PASSWORD: hrm
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hrm -d apex_hrm"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DB_URL: jdbc:postgresql://localhost:5432/apex_hrm
      DB_USER: hrm
      DB_PASSWORD: hrm
      PGPASSWORD: hrm
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: hrm
      PGDATABASE: apex_hrm
      SMTP_HEALTH_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Ensure PostgreSQL client available
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
      - name: Apply only V1 to V53 with Flyway CLI
        run: |
          set -euo pipefail
          docker run --rm --network host \
            -v "$PWD/backend/src/main/resources/db/migration:/flyway/sql:ro" \
            flyway/flyway:10.20.1 \
            -url=jdbc:postgresql://localhost:5432/apex_hrm \
            -user=hrm -password=hrm -target=53 migrate
          actual="$(psql -XAt -c "SELECT max(version::int) FROM flyway_schema_history WHERE success AND version ~ '^[0-9]+$'")"
          test "$actual" = '53' || { echo "Expected V53; received $actual"; exit 1; }
      - name: Build backend
        working-directory: backend
        run: mvn -B -ntp -DskipTests package
      - name: Upgrade V53 to V58 with production Flyway configuration
        run: |
          set -euo pipefail
          java -jar backend/target/apex-hrm-0.1.0-SNAPSHOT.jar > /tmp/m72-upgrade.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; cat /tmp/m72-upgrade.log' EXIT
          ready=false
          for n in $(seq 1 90); do
            if curl --fail --silent localhost:8080/actuator/health >/tmp/m72-upgrade-health.json; then ready=true; break; fi
            if ! kill -0 "$pid" 2>/dev/null; then exit 1; fi
            sleep 2
          done
          test "$ready" = true
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          trap - EXIT
      - name: Verify upgraded schema and tenant isolation
        run: psql -v ON_ERROR_STOP=1 -f scripts/db/m7_2_rls_certification.sql
      - name: Capture upgrade evidence
        if: always()
        run: |
          mkdir -p m72-upgrade-evidence
          psql -X -A -F, -c "SELECT installed_rank,version,description,type,success FROM flyway_schema_history ORDER BY installed_rank" > m72-upgrade-evidence/flyway_history.csv || true
      - name: Upload upgrade evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m7-2-upgrade-rehearsal
          path: m72-upgrade-evidence/
          if-no-files-found: ignore
