name: M3.4 Regression and Security
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feature/m3-4-*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m34-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    name: Maven tests + PostgreSQL/Flyway startup
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: apex_hrm
          POSTGRES_USER: hrm
          POSTGRES_PASSWORD: hrm
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hrm -d apex_hrm"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DB_URL: jdbc:postgresql://localhost:5432/apex_hrm
      DB_USER: hrm
      DB_PASSWORD: hrm
      HRM_MFA_ENCRYPTION_KEY: ${{ secrets.HRM_CI_MFA_ENCRYPTION_KEY }}
      SMTP_HEALTH_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Maven test suite
        working-directory: backend
        run: mvn -B -ntp verify
      - name: Boot application and validate Flyway/Hibernate
        working-directory: backend
        run: |
          set -euo pipefail
          java -jar target/apex-hrm-0.1.0-SNAPSHOT.jar > /tmp/apex-hrm-startup.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; cat /tmp/apex-hrm-startup.log' EXIT
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://localhost:8080/actuator/health >/tmp/apex-health.json; then
              cat /tmp/apex-health.json
              exit 0
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              echo 'Backend terminated before it became healthy'
              exit 1
            fi
            if (( attempt == 1 || attempt % 15 == 0 )); then
              printf 'Waiting for backend health (%s/90)\n' "$attempt"
            fi
            sleep 2
          done
          echo 'Backend startup timed out'
          exit 1
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  frontend:
    name: TypeScript build + Vitest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test:unit

  playwright:
    name: Chromium browser smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: frontend/test-results/
          if-no-files-found: ignore

  security:
    name: npm audit + secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependency vulnerability gate
        working-directory: frontend
        run: npm audit --audit-level=high --omit=dev
      - name: Scan repository for accidentally committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
